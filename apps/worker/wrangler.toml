name = "webshot-worker"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[vars]
# Non-secret config. Override per environment with `wrangler.<env>.toml` or the dashboard.
ALLOWED_ORIGIN = "http://localhost:5173"
RATE_LIMIT_PER_MINUTE = "10"

# Secrets (RENDERER_URL, RENDERER_SECRET) are NOT set here.
# Local dev: put them in apps/worker/.dev.vars (gitignored).
# Production: `wrangler secret put RENDERER_URL` / `wrangler secret put RENDERER_SECRET`.
